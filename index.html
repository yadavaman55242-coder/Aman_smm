<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aman SMM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 8px;
      color: #d1d5db;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .card h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #eff6ff;
      border-radius: 10px;
      text-align: center;
      display: none;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>🚀 Aman SMM</h1>
    <p>Social Media Marketing Panel</p>
  </header>

  <div class="container">
    <div class="card">

      <h2>Place Your Order</h2>

      <input
        type="text"
        id="link"
        placeholder="Enter Instagram/YouTube link"
      >

      <select id="service">
        <option value="100">Instagram Followers - ₹100</option>
        <option value="80">Instagram Likes - ₹80</option>
        <option value="120">YouTube Views - ₹120</option>
      </select>

      <input
        type="number"
        id="quantity"
        placeholder="Enter quantity"
        min="1"
      >

      <button onclick="placeOrder()">Place Order</button>

      <div class="result" id="result"></div>

    </div>
  </div>

  <footer>
    © 2026 Aman SMM
  </footer>

  <script>
    function placeOrder() {
      const link = document.getElementById("link").value;
      const service = document.getElementById("service");
      const quantity = document.getElementById("quantity").value;
      const result = document.getElementById("result");

      if (!link || !quantity) {
        result.style.display = "block";
        result.innerHTML = "⚠️ कृपया सभी जानकारी भरें।";
        return;
      }

      const price = service.value;
      const total = (quantity / 1000) * price;

      result.style.display = "block";
      result.innerHTML =
        "✅ Order Ready!<br><br>" +
        "Service: " + service.options[service.selectedIndex].text +
        "<br>Quantity: " + quantity +
        "<br>Total: ₹" + total.toFixed(2);
    }
  </script>
<a href="https://wa.me/917348572235?text=Hello%20Aman%20SMM"
   target="_blank"
   style="position:fixed;right:20px;bottom:20px;background:#25D366;color:white;padding:14px 20px;border-radius:50px;text-decoration:none;font-weight:bold;">
  💬 WhatsApp
</a>
  <!-- Add Money -->
<div class="card" style="margin-top:20px;">
  <h2>💰 Add Money</h2>

  <input
    type="number"
    id="addAmount"
    placeholder="Enter Amount ₹"
    min="1"
  >

  <input
    type="text"
    id="utr"
    placeholder="Enter UTR / Transaction ID"
  >

  <button onclick="submitPayment()">
    Submit Payment
  </button>

  <p id="paymentStatus" style="margin-top:15px;text-align:center;"></p>
</div>

<script>
function submitPayment() {
  const amount = document.getElementById("addAmount").value;
  const utr = document.getElementById("utr").value.trim();
  const status = document.getElementById("paymentStatus");

  if (!amount || Number(amount) <= 0) {
    status.innerHTML = "⚠️ Amount enter karo.";
    return;
  }

  if (!utr) {
    status.innerHTML = "⚠️ UTR / Transaction ID enter karo.";
    return;
  }

  status.innerHTML =
    "✅ Payment request submitted.<br>" +
    "Amount: ₹" + Number(amount).toFixed(2) +
    "<br>UTR: " + utr +
    "<br><small>Admin verification ke baad balance add hoga.</small>";
}
</script>
  <div class="card">
  <h2>💰 Add Money</h2>

  <p>QR Code Scan करके Payment करें</p>

  <img src="qr.png"
       alt="Payment QR"
       style="width:250px;display:block;margin:20px auto;">

  <input type="number" placeholder="Enter Amount ₹">
  <input type="text" placeholder="Enter UTR / Transaction ID">

  <button>Submit Payment</button>
  </div>
</body>
</html>
